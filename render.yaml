services:
  - type: web
    name: private-security-lab
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FINGERPRINT_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
databases:
  - name: private-security-lab-db
