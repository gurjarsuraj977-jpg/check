<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Security Lab</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0b1220;color:#e8eefc}
.card{background:#121a2b;border:1px solid #24314d;border-radius:12px;padding:16px;margin:16px auto;max-width:920px}
input,textarea,button{width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #334666;background:#0b1220;color:#e8eefc}
button{cursor:pointer;background:#2b6cb0;border:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.muted{color:#9aa9c4}
#app{display:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Private Security Lab</h1>
<section id="login" class="card">
<h2>Admin login</h2>
<input id="u" placeholder="Username"><br><br>
<input id="p" type="password" placeholder="Password"><br><br>
<button id="login-btn" type="button">Login</button>
<p id="msg" class="muted"></p>
</section>
<section id="app">
<div class="grid">
<div class="card"><b>Batches</b><div id="batches">0</div></div>
<div class="card"><b>Records</b><div id="records">0</div></div>
<div class="card"><b>Pending</b><div id="pending">0</div></div>
</div>
<div class="card">
<h2>Create batch</h2>
<p class="muted">Development/staging only. Enter authorized test fixtures, one per line.</p>
<textarea id="items" rows="8" placeholder="fixture-1&#10;fixture-2"></textarea><br><br>
<button id="create-batch-btn" type="button">Create batch</button>
<button id="logout-btn" type="button">Logout</button>
<p id="out" class="muted"></p>
</div>
<div class="card">
<h2>Recent batches</h2>
<div id="list">Loading…</div>
</div>
</section>
<script src="/static/app.js"></script>
</body>
</html>
