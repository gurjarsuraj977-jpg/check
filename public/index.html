<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Security Lab</title><style>body{font-family:system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#0b1020;color:#e8eefc}button,input,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #33415c}button{cursor:pointer}input,textarea{background:#111a2e;color:#fff;width:100%;box-sizing:border-box}.card{background:#111a2e;padding:20px;border-radius:14px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.muted{color:#9aa9c4}#app{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Private Security Lab</h1><section id="login" class="card"><h2>Admin login</h2><input id="u" placeholder="Username"><br><br><input id="p" type="password" placeholder="Password"><br><br><button onclick="login()">Login</button><p id="msg" class="muted"></p></section><section id="app"><div class="grid"><div class="card"><b>Batches</b><div id="batches">0</div></div><div class="card"><b>Records</b><div id="records">0</div></div><div class="card"><b>Pending</b><div id="pending">0</div></div></div><div class="card"><h2>Create batch</h2><p class="muted">Development/staging only. Enter authorized test fixtures, one per line.</p><textarea id="items" rows="8" placeholder="fixture-1\nfixture-2"></textarea><br><br><button onclick="createBatch()">Create batch</button> <button onclick="logout()">Logout</button><p id="out" class="muted"></p></div><div class="card"><h2>Recent batches</h2><div id="list">Loading…</div></div></section><script>
async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Request failed');return d}
async function login(){try{let d=await api('/auth/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});msg.textContent='Logged in as '+d.username;login.style.display='none';app.style.display='block';load()}catch(e){msg.textContent=e.message}}
async function load(){try{let s=await api('/api/dashboard/summary');batches.textContent=s.batches;records.textContent=s.records;pending.textContent=s.pending;let x=await api('/api/batches');list.innerHTML=x.map(b=>`<p><b>${b.reference}</b> — ${b.status} — ${b.processed}/${b.total}</p>`).join('')||'<p class="muted">No batches.</p>'}catch(e){if(e.message==='Authentication required'){login.style.display='block';app.style.display='none'}else list.textContent=e.message}}
async function createBatch(){try{let d=await api('/api/batches',{method:'POST',body:JSON.stringify({records:items.value.split(/\r?\n/).filter(Boolean)})});out.textContent=`Created ${d.batch_reference}: ${d.accepted} accepted, ${d.duplicates} duplicates`;items.value='';load()}catch(e){out.textContent=e.message}}
async function logout(){await api('/auth/logout',{method:'POST'});location.reload()}load();
</script></body></html>
